<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECONOMIC EMPIRE</title><script src="/socket.io/socket.io.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#081322;color:#eef5ff;font:16px system-ui}header,main{max-width:1000px;margin:auto;padding:20px}header{border-bottom:1px solid #28405c;font-size:26px;font-weight:900}header b{color:#49d9c6}.card{background:#12243a;border:1px solid #29425f;border-radius:18px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.team,.option{background:#0a192a;border:1px solid #314b69;border-radius:12px;padding:14px}.option{display:block;width:100%;color:white;text-align:left;margin:9px 0;font-size:16px;cursor:pointer}.option.sel{border:2px solid #49d9c6;background:#12404a}input{width:100%;padding:13px;background:#071321;color:white;border:1px solid #49617c;border-radius:9px;margin:8px 0 14px}.btn{background:#49d9c6;color:#05201d;border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.4}.hidden{display:none}.muted{color:#a7bad0}.pill{color:#49d9c6}.qr{width:220px;background:white;padding:8px;border-radius:10px}.big{font-size:40px;color:#ffcf70;font-weight:900}.row{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:650px){.grid{grid-template-columns:1fr}.teams{grid-template-columns:1fr 1fr}.card{padding:16px}}</style></head><body><header>ECONOMIC <b>EMPIRE</b> <small style="font-size:13px;color:#a7bad0"> / INSTITUTSIONAL IQTISODIYOT</small></header><main>
<section id="home" class="card"><h2>O‘yinga kirish</h2><div class="grid"><div><h3>O‘qituvchi</h3><button class="btn" id="create">Yangi xona yaratish</button></div><div><h3>Jamoa</h3><input id="code" placeholder="Xona kodi"><input id="name" placeholder="Jamoa nomi"><button class="btn" id="join">QR / kod orqali kirish</button></div></div><p id="msg" class="muted"></p></section>
<section id="host" class="hidden"><div class="card"><div class="pill">O‘QITUVCHI PANELI</div><h2>Xona kodi: <span id="room" class="big"></span></h2><div class="grid"><div><img id="qr" class="qr"><p class="muted">QR-kodni jamoalarga ko‘rsating.</p></div><div><h3>Ulangan jamoalar</h3><div id="ht" class="teams"></div><button class="btn" id="start">O‘yinni boshlash</button></div></div></div><div class="card" id="hg"></div></section>
<section id="team" class="hidden card"><div class="pill">JAMOA KABINETI</div><h2 id="tn"></h2><div id="tg">O‘qituvchini kuting...</div></section>
<section id="end" class="card hidden"><h2>Yakuniy reyting</h2><div id="results"></div><button class="btn" id="reset">Qayta boshlash</button></section></main><footer style="text-align:center;color:#8295ae;padding:24px">by Qosimbek Tursunov</footer><script>
const sock=io(),$=x=>document.getElementById(x);let role="",code="",id="",name="",opts=[],selected=-1,state=null;
function page(p){["home","host","team","end"].forEach(x=>$(x).classList.toggle("hidden",x!==p))}
$("create").onclick=()=>sock.emit("create",{},r=>{role="host";code=r.code;$("room").textContent=code;$("qr").src="/qr/"+code+".png";page("host")});
$("join").onclick=()=>sock.emit("join",{code:$("code").value.trim().toUpperCase(),name:$("name").value.trim()||"Jamoa"},r=>{if(!r.ok){$("msg").textContent=r.error;return}role="team";id=r.id;name=$("name").value||"Jamoa";$("tn").textContent=name;page("team")});
$("start").onclick=()=>sock.emit("start",{},r=>{if(!r.ok)alert(r.error)});
$("reset").onclick=()=>sock.emit("reset");
sock.on("choices",a=>{opts=a;drawTeam()});
sock.on("state",s=>{state=s;if(role==="host")drawHost();if(role==="team")drawTeam();if(s.status==="finished"){page("end");$("results").innerHTML=rank(s)}})
function teams(s){return s.teams.map(t=>`<div class="team"><b>${esc(t.name)}</b><p>${t.score} ball</p><span class="pill">${t.submitted?"Javob yuborildi":"Kutmoqda"}</span></div>`).join("")}
function drawHost(){let s=state;$("ht").innerHTML=teams(s)||"Jamoalar kutilmoqda";let g=$("hg");if(s.status==="lobby"){g.innerHTML="<p class=muted>Jamoalar qo‘shilgach, o‘yinni boshlang.</p>";return}if(s.status==="question"){g.innerHTML=`<div class=pill>${s.round+1}-TUR / ${s.total}</div><h2>${esc(s.current.title)}</h2><p>${esc(s.current.story)}</p><h3>${esc(s.current.q)}</h3><div class=big>${s.current.seconds} soniya</div><p>${s.teams.filter(t=>t.submitted).length}/${s.teams.length} jamoa javob berdi. Javoblar yashirin.</p>`;return}if(s.status==="reveal"){let c=s.current;g.innerHTML=`<h2>${esc(c.title)}</h2><h3>To‘g‘ri javob: ${esc(c.opts[c.correct])}</h3><p>${esc(c.why)}</p><h3>Ballar</h3>${teams(s)}<p><button class=btn id=next>${s.round===s.total-1?"Natijani ko‘rish":"Keyingi tur"}</button></p>`;$("next").onclick=()=>sock.emit("next",{},()=>{});}}
function drawTeam(){if(!state)return;let s=state,g=$("tg");if(s.status==="lobby"){g.innerHTML="O‘qituvchi o‘yinni boshlashini kuting.";return}if(s.status==="question"){if(s.teams.find(t=>t.id===id)?.submitted){g.innerHTML="<h2>Javob yuborildi ✓</h2><p class=muted>Boshqa jamoalar javobini kuting. Tanlovingiz yashirin.</p>";return}let c=s.current;g.innerHTML=`<div class=pill>${s.round+1}-TUR</div><h2>${esc(c.title)}</h2><p>${esc(c.story)}</p><h3>${esc(c.q)}</h3><div class=big>${c.seconds} s</div><div>${opts.map((o,i)=>`<button class="option ${selected===i?"sel":""}" data-i="${i}">${"ABCD"[i]}. ${esc(o)}</button>`).join("")}</div><button class=btn id=send ${selected<0?"disabled":""}>Javobni yuborish</button>`;document.querySelectorAll(".option").forEach(b=>b.onclick=()=>{selected=+b.dataset.i;drawTeam()});$("send").onclick=()=>sock.emit("answer",{choice:selected},r=>{if(!r.ok)alert("Javob yuborilmadi")});return}if(s.status==="reveal"){let c=s.current;g.innerHTML=`<h2>Tur yakunlandi</h2><p>To‘g‘ri javob: ${esc(c.opts[c.correct])}</p><p>${esc(c.why)}</p><h3>Sizning ballingiz: ${s.teams.find(t=>t.id===id)?.score||0}</h3><p class=muted>Keyingi turni o‘qituvchi boshlaydi.</p>`;selected=-1}}
function rank(s){return s.teams.slice().sort((a,b)=>b.score-a.score).map((t,i)=>`<div class=team>${i+1}. <b>${esc(t.name)}</b> — ${t.score} ball</div>`).join("")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
let j=new URLSearchParams(location.search).get("join");if(j){$("code").value=j;$("name").focus()}
</script></body></html>
